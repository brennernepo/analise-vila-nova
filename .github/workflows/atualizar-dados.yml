# Coleta os jogos da Série B na ESPN, recalcula a simulação e envia os arquivos gerados.
# O Streamlit Community Cloud republica o painel sozinho a cada commit na main.
name: Atualizar dados

on:
  schedule:
    # Horários em UTC: 22:00, 03:30 e 15:30 em Brasília. O das 22h pega os jogos da noite no mesmo dia;
    # o das 03:30 cobre os que terminam mais tarde ou atrasam na ESPN.
    - cron: "0 1 * * *"
    - cron: "30 6 * * *"
    - cron: "30 18 * * *"
  # Botão "Run workflow" na aba Actions, para pedir uma atualização na hora.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dados.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dados.txt

      - name: Coletar jogos e rodar a simulação
        run: python coleta_detalhada.py

      - name: Enviar arquivos atualizados
        run: |
          # Sem jogo novo, só a data "gerado_em" da simulação mudaria: não vale um commit.
          if git diff --quiet -- vila_nova_serie_b_2026_todos_jogos.csv serie_b_2026_jogos.csv; then
            echo "Nenhum jogo novo."
            exit 0
          fi
          git add vila_nova_serie_b_2026_todos_jogos.csv serie_b_2026_jogos.csv serie_b_2026_probabilidades.csv simulacao_2026.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza dados da Série B ($(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M'))"
          git push
